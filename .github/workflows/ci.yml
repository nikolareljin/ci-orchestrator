name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gradle:
    uses: nikolareljin/ci-helpers/.github/workflows/java-gradle.yml@production
    with:
      java_version: '21'
      lint_command: './gradlew :tests:unit:check -x test'
      test_command: './gradlew :tests:unit:test'
      build_command: './gradlew :tests:unit:build'
